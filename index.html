<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: #fff;
    min-height: 100vh;
}

header {
    height: 70px;
    background: #0d111b;
    border-bottom: 1px solid #202738;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #00aaff;
}

.status {
    color: #6d778a;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.hero {
    margin-bottom: 25px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.hero p {
    color: #8791a5;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    background: #0e131f;
    border: 1px solid #20283a;
    border-radius: 15px;
    padding: 22px;
}

.card h2 {
    margin-bottom: 18px;
    font-size: 20px;
}

.full {
    grid-column: 1 / -1;
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    background: #080c15;
    border: 1px solid #293349;
    color: white;
    padding: 13px;
    border-radius: 9px;
    outline: none;
}

input:focus {
    border-color: #00aaff;
}

button {
    background: #0099ff;
    border: none;
    color: white;
    padding: 13px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #0084dd;
}

.profile {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: #080c15;
    border-radius: 12px;
}

.profile-top {
    display: flex;
    align-items: center;
    gap: 18px;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    background: #161d2c;
}

.username {
    font-size: 22px;
    font-weight: bold;
}

.user-id {
    color: #778196;
    margin-top: 5px;
    font-size: 13px;
}

.online {
    margin-top: 12px;
    font-weight: bold;
}

.green {
    color: #32d583;
}

.gray {
    color: #8791a5;
}

.game {
    margin-top: 12px;
    color: #cbd3e1;
}

.music input[type="file"] {
    width: 100%;
    margin-bottom: 15px;
}

audio {
    width: 100%;
}

.tools {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.tool {
    background: #151c2b;
    border: 1px solid #242e43;
    padding: 17px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
}

.tool:hover {
    background: #1b2538;
}

.result {
    margin-top: 15px;
    color: #aeb8c9;
}

footer {
    text-align: center;
    color: #596477;
    padding: 30px;
}

@media (max-width: 750px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .tools {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        padding: 0 15px;
    }

    .container {
        padding: 20px 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ Game<span>Hub</span></div>
    <div class="status">v1.0</div>
</header>

<div class="container">

    <div class="hero">
        <h1>GameHub Dashboard</h1>
        <p>Roblox tools, player tracker, music and utilities.</p>
    </div>

    <div class="grid">

        <!-- ROBLOX -->
        <div class="card full">

            <h2>🎮 Roblox Player Tracker</h2>

            <div class="input-row">
                <input
                    id="username"
                    type="text"
                    placeholder="Wpisz Roblox username..."
                >

                <button onclick="searchPlayer()">
                    🔎 Szukaj
                </button>
            </div>

            <div id="profile" class="profile">

                <div class="profile-top">

                    <img id="avatar" class="avatar">

                    <div>
                        <div id="displayName" class="username">
                            —
                        </div>

                        <div id="userId" class="user-id">
                            ID: —
                        </div>

                        <div id="presence" class="online">
                            —
                        </div>
                    </div>

                </div>

                <div id="game" class="game"></div>

                <br>

                <button onclick="openRobloxProfile()">
                    Otwórz profil Roblox
                </button>

            </div>

        </div>

        <!-- MUSIC -->
        <div class="card">

            <h2>🎵 Music Player</h2>

            <input
                type="file"
                id="musicFile"
                accept="audio/*"
            >

            <audio
                id="player"
                controls
            ></audio>

            <p class="result">
                Wybierz plik MP3/WAV z komputera.
            </p>

        </div>

        <!-- QUICK TOOLS -->
        <div class="card">

            <h2>🛠️ Quick Tools</h2>

            <div class="tools">

                <div class="tool" onclick="generatePassword()">
                    🔐 Hasło
                </div>

                <div class="tool" onclick="generateColor()">
                    🎨 Kolor
                </div>

                <div class="tool" onclick="showTime()">
                    🕒 Czas
                </div>

                <div class="tool" onclick="copyIP()">
                    🌐 IP
                </div>

                <div class="tool" onclick="openRoblox()">
                    🕹️ Roblox
                </div>

                <div class="tool" onclick="about()">
                    ℹ️ About
                </div>

            </div>

            <div id="toolResult" class="result"></div>

        </div>

    </div>

</div>

<footer>
    GameHub v1.0 • Made with HTML / CSS / JavaScript
</footer>


<script>

let currentUserId = null;


// =============================
// ROBLOX PLAYER SEARCH
// =============================

async function searchPlayer() {

    const username =
        document.getElementById("username").value.trim();

    if (!username) {
        alert("Wpisz username Roblox.");
        return;
    }

    const profile =
        document.getElementById("profile");

    profile.style.display = "block";

    document.getElementById("displayName").textContent =
        "Ładowanie...";

    document.getElementById("presence").textContent =
        "";

    document.getElementById("game").textContent =
        "";

    try {

        // Roblox Users API
        const response = await fetch(
            "https://users.roblox.com/v1/usernames/users",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usernames: [username],
                    excludeBannedUsers: false
                })
            }
        );

        const data = await response.json();

        if (!data.data || data.data.length === 0) {

            document.getElementById("displayName").textContent =
                "Nie znaleziono użytkownika.";

            return;
        }

        const user = data.data[0];

        currentUserId = user.id;

        document.getElementById("displayName").textContent =
            user.displayName + " (@" + user.name + ")";

        document.getElementById("userId").textContent =
            "ID: " + user.id;

        // Avatar
        document.getElementById("avatar").src =
            "https://www.roblox.com/headshot-thumbnail/image?userId="
            + user.id
            + "&width=180&height=180&format=png";

        await getPresence(user.id);

    } catch (error) {

        console.error(error);

        document.getElementById("displayName").textContent =
            "Błąd połączenia z Roblox API.";

    }
}


// =============================
// ROBLOX PRESENCE
// =============================

async function getPresence(userId) {

    try {

        const response = await fetch(
            "https://presence.roblox.com/v1/presence/users",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userIds: [userId]
                })
            }
        );

        const data = await response.json();

        if (!data.userPresences ||
            data.userPresences.length === 0) {

            document.getElementById("presence").textContent =
                "⚪ Brak informacji o statusie";

            return;
        }

        const presence = data.userPresences[0];

        const presenceElement =
            document.getElementById("presence");

        const gameElement =
            document.getElementById("game");


        /*
        Roblox presenceType:

        0 = Offline
        1 = Online
        2 = In Game
        3 = In Studio
        */

        if (presence.userPresenceType === 0) {

            presenceElement.textContent =
                "⚪ OFFLINE";

            presenceElement.className =
                "online gray";

            gameElement.textContent = "";

        }

        else if (presence.userPresenceType === 1) {

            presenceElement.textContent =
                "🟢 ONLINE";

            presenceElement.className =
                "online green";

            gameElement.textContent =
                "";

        }

        else if (presence.userPresenceType === 2) {

            presenceElement.textContent =
                "🟢 W GRZE";

            presenceElement.className =
                "online green";

            gameElement.textContent =
                "🎮 " +
                (presence.lastLocation ||
                "Gra Roblox");

        }

        else if (presence.userPresenceType === 3) {

            presenceElement.textContent =
                "🟡 ROBLOX STUDIO";

            presenceElement.className =
                "online";

            gameElement.textContent =
                "";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("presence").textContent =
            "❌ Nie udało się sprawdzić statusu.";

    }
}


// =============================
// ROBLOX PROFILE
// =============================

function openRobloxProfile() {

    if (!currentUserId) return;

    window.open(
        "https://www.roblox.com/users/"
        + currentUserId
        + "/profile",
        "_blank"
    );
}


function openRoblox() {

    window.open(
        "https://www.roblox.com/",
        "_blank"
    );

}


// =============================
// MUSIC
// =============================

document
.getElementById("musicFile")
.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const player =
        document.getElementById("player");

    player.src =
        URL.createObjectURL(file);

    player.play();

});


// =============================
// TOOLS
// =============================

function generatePassword() {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let password = "";

    for (let i = 0; i < 16; i++) {

        password +=
            chars[Math.floor(Math.random() * chars.length)];

    }

    document.getElementById("toolResult").textContent =
        "Wygenerowane hasło: " + password;

}


function generateColor() {

    const color =
        "#" +
        Math.floor(Math.random() * 16777215)
        .toString(16)
        .padStart(6, "0");

    document.getElementById("toolResult").textContent =
        "Losowy kolor: " + color;

}


function showTime() {

    const now =
        new Date();

    document.getElementById("toolResult").textContent =
        "Aktualny czas: " +
        now.toLocaleTimeString("pl-PL");

}


async function copyIP() {

    document.getElementById("toolResult").textContent =
        "Pobieranie IP...";

    try {

        const response =
            await fetch("https://api.ipify.org?format=json");

        const data =
            await response.json();

        document.getElementById("toolResult").textContent =
            "Twoje publiczne IP: " + data.ip;

    } catch {

        document.getElementById("toolResult").textContent =
            "Nie udało się pobrać IP.";

    }

}


function about() {

    document.getElementById("toolResult").textContent =
        "GameHub v1.0 — Roblox tools & utilities.";

}

</script>

</body>
</html>
